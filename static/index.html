<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston, We Have a Packet Loss</title>
<style>
  :root{
    --bg:#0e1216; --panel:#161d26; --panel-2:#121822; --edge:#232e3b; --grid:#1b2531;
    --amber:#f5b740; --amber-dim:#8a6d33; --go:#5fd08a; --caution:#f5b740; --alarm:#e5533d;
    --label:#8a97a6; --label-dim:#586675;
    --mono: ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;scrollbar-width:none;-ms-overflow-style:none;}

  body::-webkit-scrollbar{display:none;}

  body{
    background:#0f1722;
    color:var(--label); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:clamp(14px,3vw,32px);
  }
  .console{max-width:95%;margin:0 auto}
  .label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--label);font-weight:600}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--edge)}
  .callsign{display:flex;align-items:baseline;gap:12px}
  .callsign h1{font-family:var(--mono);font-size:clamp(15px,2.4vw,20px);letter-spacing:.04em;color:#dfe7ef;margin:0;font-weight:600}
  .callsign .tag{font-size:10px;letter-spacing:.28em;color:var(--label-dim);text-transform:uppercase;
    border:1px solid var(--edge);padding:2px 7px;border-radius:2px}
  .get{text-align:right}
  .get .v{font-family:var(--mono);font-size:clamp(16px,2.6vw,22px);color:var(--amber);letter-spacing:.06em}
  .get .label{color:var(--label-dim);font-size:10px}

  .alarm-strip{margin:14px 0;border:1px solid var(--edge);border-left-width:4px;border-left-color:var(--label-dim);
    background:var(--panel-2);
    border-radius:3px;padding:14px 18px;
    display:flex;align-items:center;gap:16px}
  .alarm-strip .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--label-dim)}
  .alarm-strip .msg{font-family:var(--mono);font-size:clamp(15px,2.6vw,21px);letter-spacing:.08em;color:#c7d0da}
  .alarm-strip .sub{margin-left:auto;font-size:11px;letter-spacing:.16em;color:var(--label-dim);text-transform:uppercase}
  .state-nominal{border-left-color:var(--go)}
  .state-nominal .dot{background:var(--go);box-shadow:0 0 14px 1px rgba(95,208,138,.55)}
  .state-nominal .msg{color:var(--go)}
  .state-caution{border-left-color:var(--caution)}
  .state-caution .dot{background:var(--caution);box-shadow:0 0 14px 1px rgba(245,183,64,.5)}
  .state-caution .msg{color:var(--caution)}

  .state-alarm{border-left-color:var(--alarm);background:var(--panel-2);}
  .state-alarm .dot{background:var(--alarm);box-shadow:0 0 16px 2px rgba(229,83,61,.6);animation:pulse 1.1s ease-in-out infinite}
  .state-alarm .msg{color:var(--alarm)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
  .cell{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:16px 16px 14px;position:relative;overflow:hidden}
  .cell::before{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;
    border-top:1px solid var(--edge);border-right:1px solid var(--edge)}
  .cell .read{margin-top:12px;display:flex;align-items:baseline;gap:6px}
  .cell .val{font-family:var(--mono);font-size:clamp(26px,5vw,40px);color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
  .cell .unit{font-family:var(--mono);font-size:13px;color:var(--amber-dim)}
  .cell.hot .val{color:var(--alarm)}
  .cell.warm .val{color:var(--caution)}

  .scopes{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
  .scope{background:var(--panel-2);border:1px solid var(--edge);border-radius:4px;padding:12px 14px 8px;position:relative}
  .scope .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .scope .head .rng{font-family:var(--mono);font-size:11px;color:var(--label-dim)}
  .scope canvas{display:block;width:100%;height:132px;cursor:crosshair}

  /* Hover inspector — a small phosphor badge with the exact reading. */
  .badge{
    position:absolute;pointer-events:none;
    background:rgba(14,18,22,.92);border:1px solid var(--edge);border-radius:3px;
    padding:5px 8px;font-family:var(--mono);font-size:11px;
    color:var(--amber);letter-spacing:.04em;white-space:nowrap;
    transform:translate(-50%,calc(-100% - 10px));
    opacity:0;transition:opacity .08s linear;
    box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2;
  }
  .badge.on{opacity:1}
  .badge .t{color:var(--label-dim);display:block;font-size:10px;letter-spacing:.08em;margin-top:2px}

  footer .left{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  footer a.rec{color:var(--label);text-decoration:none;border-bottom:1px dotted var(--edge);padding-bottom:1px;transition:color .1s,border-color .1s}
  footer a.rec:hover{color:var(--amber);border-color:var(--amber)}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .strip .cell{padding:12px 14px}
  .strip .v{font-family:var(--mono);font-size:14px;color:#c7d0da;margin-top:8px;letter-spacing:.02em;word-break:break-word}
  .strip .v.go{color:var(--go)}
  .strip .v.alarm{color:var(--alarm)}

  footer{margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--label-dim)}
  footer .conn{display:flex;align-items:center;gap:7px}
  footer .conn .d{width:7px;height:7px;border-radius:50%;background:var(--label-dim)}
  footer .conn.live .d{background:var(--go);box-shadow:0 0 8px rgba(95,208,138,.6)}
  footer .conn.lost .d{background:var(--alarm);box-shadow:0 0 8px rgba(229,83,61,.6)}

  @media(max-width:720px){
    .readouts{grid-template-columns:repeat(2,1fr)}
    .strip{grid-template-columns:repeat(2,1fr)}
    .alarm-strip .sub{display:none}
  }
  @media(prefers-reduced-motion:reduce){ .state-alarm .dot{animation:none} }
</style>
</head>
<body>
<div class="console">

  <header>
    <div class="callsign">
      <h1>HOUSTON</h1>
      <span class="tag">We Have a Packet Loss</span>
    </div>
    <div class="get">
      <div class="v num" id="get">—:—:—:—</div>
      <div class="label">Ground Elapsed Time</div>
    </div>
  </header>

  <div class="alarm-strip" id="alarm">
    <span class="dot"></span>
    <span class="msg" id="alarm-msg">AWAITING TELEMETRY…</span>
    <span class="sub" id="alarm-sub">standing by</span>
  </div>

  <div class="readouts">
    <div class="cell" id="c-lat"><div class="label">Ping</div><div class="read"><span class="val" id="v-lat">—</span><span class="unit">ms</span></div></div>
    <div class="cell" id="c-down"><div class="label">Download</div><div class="read"><span class="val" id="v-down">—</span><span class="unit">Mbps</span></div></div>
    <div class="cell" id="c-up"><div class="label">Upload</div><div class="read"><span class="val" id="v-up">—</span><span class="unit">Mbps</span></div></div>
    <div class="cell" id="c-drop"><div class="label">Packet Loss</div><div class="read"><span class="val" id="v-drop">—</span><span class="unit">%</span></div></div>
  </div>

  <div class="scopes">
    <div class="scope"><div class="head"><span class="label">Ping</span><span class="rng" id="rng-lat"></span></div><canvas id="sc-lat"></canvas></div>
    <div class="scope"><div class="head"><span class="label">Packet Loss</span><span class="rng" id="rng-loss"></span></div><canvas id="sc-loss"></canvas></div>
    <div class="scope"><div class="head"><span class="label">Download</span><span class="rng" id="rng-down"></span></div><canvas id="sc-down"></canvas></div>
    <div class="scope"><div class="head"><span class="label">Upload</span><span class="rng" id="rng-up"></span></div><canvas id="sc-up"></canvas></div>
  </div>

  <div class="strip">
    <div class="cell"><div class="label">Line of Sight</div><div class="v" id="v-obs">—</div></div>
    <div class="cell"><div class="label">Terminal</div><div class="v" id="v-hw">—</div></div>
    <div class="cell"><div class="label">Firmware</div><div class="v" id="v-sw">—</div></div>
    <div class="cell"><div class="label">Last Contact</div><div class="v num" id="v-seen">—</div></div>
  </div>

  <footer>
    <div class="left">
      <span>HOUSTON, WE HAVE a PACKET LOSS</span>
      <a href="/log" target="_blank" rel="noopener" class="rec" title="Open the raw JSONL telemetry log">Raw Log</a>
    </div>
    <span class="conn" id="conn"><span class="d"></span><span id="conn-txt">Connecting…</span></span>
  </footer>

</div>

<script>
(() => {
  "use strict";

  const STATES = {
    "ONLINE":     {cls:"state-nominal", msg:"ALL SYSTEMS NOMINAL",       sub:""},
    "DEGRADED":   {cls:"state-caution", msg:"PACKET LOSS DETECTED",      sub:"caution"},
    "OBSTRUCTED": {cls:"state-alarm",   msg:"LINE OF SIGHT OBSTRUCTED",  sub:"off-nominal"},
    "NO SIGNAL":  {cls:"state-alarm",   msg:"SIGNAL LOST — REACQUIRING", sub:"off-nominal"},
    "OFFLINE":    {cls:"state-alarm",   msg:"TELEMETRY LINK DOWN",       sub:"no contact"},
  };

  const $ = id => document.getElementById(id);
  const alarm = $("alarm"), alarmMsg = $("alarm-msg"), alarmSub = $("alarm-sub");
  const conn = $("conn"), connTxt = $("conn-txt");
  const fmt = (v, d=1) => (v==null || isNaN(v)) ? "—" : Number(v).toFixed(d);

  function get(sec){
    sec = Math.max(0, Math.floor(sec||0));
    const d = Math.floor(sec/86400); sec-=d*86400;
    const h = Math.floor(sec/3600);  sec-=h*3600;
    const m = Math.floor(sec/60);    const s = sec-m*60;
    const p = n => String(n).padStart(2,"0");
    return `${String(d).padStart(3,"0")}:${p(h)}:${p(m)}:${p(s)}`;
  }

  function setState(link){
    const st = STATES[link] || STATES["OFFLINE"];
    alarm.className = "alarm-strip " + st.cls;
    alarmMsg.textContent = st.msg;
    alarmSub.textContent = st.sub;
  }

  // tStart is recomputed on every draw so the strip advances smoothly.
  const WINDOW_MS = 60 * 45 * 1000; // 1 hour
  const GAP_MS    = 5 * 1000;       // >5s between adjacent samples = break trace
  const MAXPTS    = 3600;           // upper cap on retained samples (~1h @ 1Hz)

  const cssCache = {};
  function getCSS(name){
    if(!cssCache[name]) cssCache[name]=getComputedStyle(document.documentElement).getPropertyValue(name);
    return cssCache[name];
  }

  // Pick a gridline step that respects the scope's ideal step (minimum) but
  // scales up through nice human-readable values so we never crowd the axis
  // with more than ~6 divisions.
  const STEP_CASCADE = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
  function niceStep(top, ideal){
    for(const s of STEP_CASCADE){
      if(s >= ideal && top/s <= 6) return s;
    }
    return STEP_CASCADE[STEP_CASCADE.length-1];
  }

  function makeScope(opts){
    const cv = $(opts.canvas), ctx = cv.getContext("2d"), rngEl = $(opts.rng);
    // Each point is {t: Date, v: number}. Chronological order is preserved
    // by construction (Publish is single-writer server-side, backfill arrives
    // sorted, live samples arrive newest-last).
    const hist = [];
    let hoverIdx = -1;
    let W=0, H=0;

    const fmtVal = opts.fmtVal || (v => `${Math.round(v)} ${opts.unit}`);

    // Badge lives inside the scope's own container so it's clipped correctly.
    const badge = document.createElement("div");
    badge.className = "badge";
    cv.parentElement.appendChild(badge);

    function resize(){
      const dpr = window.devicePixelRatio || 1;
      const r = cv.getBoundingClientRect();
      W = r.width; H = r.height;
      cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      draw();
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      if(!W) return;

      const tEnd   = Date.now();
      const tStart = tEnd - WINDOW_MS;
      const xOf = t => W * (t - tStart) / WINDOW_MS;

      // Peak over visible samples only — a spike from 45 minutes ago
      // shouldn't dictate today's scale after it scrolls off.
      let peak = 0, visibleCount = 0;
      for(let i=0;i<hist.length;i++){
        const p = hist[i];
        if(p.t < tStart) continue;
        visibleCount++;
        if(p.v > peak) peak = p.v;
      }
      const top = Math.max(opts.floor, Math.ceil(Math.max(peak,0)*1.25/opts.gran)*opts.gran);
      rngEl.textContent = visibleCount ? `0–${top} ${opts.unit} · 45min` : "45min span";
      const plotH = H - 14;
      const amber = getCSS("--amber").trim();
      const yOf = v => plotH * (1 - Math.min(v,top)/top);

      // Grid
      ctx.strokeStyle = getCSS("--grid"); ctx.lineWidth = 1;
      ctx.font = "10px " + getCSS("--mono").trim();
      ctx.fillStyle = getCSS("--label-dim");
      const step = opts.step ? niceStep(top, opts.step) : top/4;
      const divisions = Math.max(1, Math.round(top/step));
      for(let i=0;i<=divisions;i++){
        const y = Math.round(plotH*i/divisions) + 0.5;
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
        const val = Math.round(top - i*step);
        ctx.fillText(String(val), 2, (y-3<8) ? y+11 : y-3);
      }
      if(visibleCount < 1) return;

      // Split visible samples into contiguous segments, breaking anywhere
      // consecutive readings are more than GAP_MS apart. Each segment gets
      // its own fill + stroke so offline periods render as blank space.
      const segments = [];
      let cur = [];
      for(let i=0;i<hist.length;i++){
        const p = hist[i];
        if(p.t < tStart) continue;
        if(cur.length > 0 && p.t - cur[cur.length-1].t > GAP_MS){
          segments.push(cur); cur = [];
        }
        cur.push(p);
      }
      if(cur.length > 0) segments.push(cur);

      for(const seg of segments){
        // Fill under
        ctx.beginPath();
        ctx.moveTo(xOf(seg[0].t), plotH);
        for(const p of seg) ctx.lineTo(xOf(p.t), yOf(p.v));
        ctx.lineTo(xOf(seg[seg.length-1].t), plotH);
        ctx.closePath();
        // Trace
        ctx.beginPath();
        for(let j=0;j<seg.length;j++){
          const x = xOf(seg[j].t), y = yOf(seg[j].v);
          j ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
        }
        ctx.strokeStyle = amber; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.stroke();
      }

      // Leading dot on the most recent visible sample
      const last = hist[hist.length-1];
      if(last && last.t >= tStart){
        const lx = xOf(last.t), ly = yOf(last.v);
        ctx.beginPath(); ctx.arc(lx,ly,2.6,0,Math.PI*2); ctx.fillStyle=amber; ctx.fill();
      }

      // Hover crosshair
      if(hoverIdx >= 0 && hoverIdx < hist.length){
        const p = hist[hoverIdx];
        if(p.t >= tStart){
          const hx = xOf(p.t), hy = yOf(p.v);
          ctx.strokeStyle = "rgba(245,183,64,.35)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(Math.round(hx)+0.5, 0); ctx.lineTo(Math.round(hx)+0.5, plotH); ctx.stroke();
          ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, Math.PI*2); ctx.fillStyle = amber; ctx.fill();
          ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, Math.PI*2);
          ctx.strokeStyle = "rgba(245,183,64,.45)"; ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }

    // pushSilent: append without redrawing. Used during backfill so we can
    // insert 3600 samples in ~3600 ms of wall time without repainting once
    // per sample. Caller must invoke draw() when the batch is done.
    function pushSilent(t, v){
      hist.push({t, v});
      while(hist.length > MAXPTS) hist.shift();
    }
    function push(t, v){
      pushSilent(t, v);
      if(hoverIdx >= 0 && lastMouseX !== null) hoverIdx = idxAtX(lastMouseX);
      draw();
      if(hoverIdx >= 0) updateBadge();
    }

    // Binary search for the sample closest in TIME to the pixel x. Then
    // gate on pixel distance so hovering in the middle of a big gap doesn't
    // snap onto a distant sample from the far side of the gap.
    function idxAtX(px){
      if(hist.length < 1) return -1;
      const tEnd   = Date.now();
      const tStart = tEnd - WINDOW_MS;
      const tTarget = tStart + (px/W) * WINDOW_MS;

      let lo = 0, hi = hist.length - 1;
      while(lo < hi){
        const mid = (lo + hi) >> 1;
        if(hist[mid].t < tTarget) lo = mid + 1; else hi = mid;
      }
      let idx = lo;
      if(lo > 0 && Math.abs(hist[lo-1].t - tTarget) < Math.abs(hist[lo].t - tTarget)){
        idx = lo - 1;
      }
      if(hist[idx].t < tStart) return -1;
      // Snap only if within ~8px of the nearest sample.
      const sampleX = W * (hist[idx].t - tStart) / WINDOW_MS;
      if(Math.abs(sampleX - px) > 8) return -1;
      return idx;
    }

    function updateBadge(){
      if(hoverIdx < 0 || hoverIdx >= hist.length){ badge.classList.remove("on"); return; }
      const p = hist[hoverIdx];
      const tEnd   = Date.now();
      const tStart = tEnd - WINDOW_MS;
      const hx = W * (p.t - tStart) / WINDOW_MS;

      const bx = cv.offsetLeft + hx;
      const by = cv.offsetTop;
      badge.style.left = bx + "px";
      badge.style.top  = by + "px";

      const ts = p.t;
      const hh = String(ts.getHours()).padStart(2,"0");
      const mm = String(ts.getMinutes()).padStart(2,"0");
      const ss = String(ts.getSeconds()).padStart(2,"0");
      const ms = String(ts.getMilliseconds()).padStart(3,"0");
      badge.innerHTML = `${fmtVal(p.v)}<span class="t">${hh}:${mm}:${ss}.${ms}</span>`;
      badge.classList.add("on");
    }

    let lastMouseX = null;
    cv.addEventListener("mousemove", e => {
      const r = cv.getBoundingClientRect();
      lastMouseX = e.clientX - r.left;
      const newIdx = idxAtX(lastMouseX);
      if(newIdx !== hoverIdx){ hoverIdx = newIdx; draw(); }
      updateBadge();
    });
    cv.addEventListener("mouseleave", () => {
      lastMouseX = null;
      hoverIdx = -1;
      badge.classList.remove("on");
      draw();
    });

    return {resize, draw, push, pushSilent};
  }

  const fmtMs   = v => `${Math.round(v)} ms`;
  const fmtPct  = v => `${v.toFixed(2)} %`;
  const fmtMbps = v => `${v.toFixed(1)} Mbps`;

  const latScope  = makeScope({canvas:"sc-lat",  rng:"rng-lat",  unit:"ms",   floor:60,  gran:20,  fmtVal: fmtMs});
  const lossScope = makeScope({canvas:"sc-loss", rng:"rng-loss", unit:"%",    floor:5,   gran:5,   step:1, fmtVal: fmtPct});
  const downScope = makeScope({canvas:"sc-down", rng:"rng-down", unit:"Mbps", floor:100, gran:100, fmtVal: fmtMbps});
  const upScope   = makeScope({canvas:"sc-up",   rng:"rng-up",   unit:"Mbps", floor:20,  gran:20,  fmtVal: fmtMbps});
  const scopes = [latScope, lossScope, downScope, upScope];

  // ---- Applying samples ----
  // updateReadouts sets the current-state UI (alarm strip, tiles, GET clock).
  // chartSample only pushes to the strip charts. Splitting the two lets
  // backfill push 3600 samples silently and then apply readouts once, from
  // the newest sample, without doing 3600 pointless UI updates.
  function updateReadouts(s){
    setState(s.link);
    $("v-lat").textContent  = fmt(s.latency_ms,0);
    $("v-down").textContent = fmt(s.downlink_mbps,1);
    $("v-up").textContent   = fmt(s.uplink_mbps,1);
    const dropPct = (s.drop_rate||0)*100;
    $("v-drop").textContent = fmt(dropPct,1);

    $("c-lat").className  = "cell" + (s.latency_ms>100 ? " hot" : s.latency_ms>70 ? " warm" : "");
    $("c-drop").className = "cell" + (dropPct>5 ? " hot" : dropPct>0.5 ? " warm" : "");

    $("v-obs").textContent = s.obstructed ? "OBSTRUCTED" : "CLEAR";
    $("v-obs").className = "v " + (s.obstructed ? "alarm" : "go");
    if(s.hardware_version) $("v-hw").textContent = s.hardware_version;
    if(s.software_version) $("v-sw").textContent = s.software_version;
    $("get").textContent = get(s.uptime_seconds);
    $("v-seen").textContent = s.timestamp
      ? new Date(s.timestamp).toLocaleTimeString()
      : new Date().toLocaleTimeString();
  }

  function chartSample(s, silent){
    if(s.link === "OFFLINE") return;
    const t = s.timestamp ? new Date(s.timestamp) : new Date();
    const dropPct = (s.drop_rate||0)*100;
    const method = silent ? "pushSilent" : "push";
    lossScope[method](t, dropPct);
    downScope[method](t, s.downlink_mbps||0);
    upScope[method](t, s.uplink_mbps||0);
    if(s.latency_ms>0) latScope[method](t, s.latency_ms);
  }

  function applyLive(s){ updateReadouts(s); chartSample(s, false); }

  function applyBackfill(samples){
    if(!Array.isArray(samples) || samples.length === 0) return;
    for(const s of samples) chartSample(s, true);
    scopes.forEach(sc => sc.draw());
    updateReadouts(samples[samples.length-1]);
  }

  function connect(){
    const es = new EventSource("/events");
    es.onopen  = () => { conn.className="conn live"; connTxt.textContent="Telemetry live"; };
    es.addEventListener("backfill", e => { try{ applyBackfill(JSON.parse(e.data)); }catch(_){} });
    es.onmessage = e => { try{ applyLive(JSON.parse(e.data)); }catch(_){} };
    es.onerror   = () => { conn.className="conn lost"; connTxt.textContent="Reacquiring…"; setState("OFFLINE"); };
  }

  // Repaint once per second even without new data, so the strip keeps
  // advancing to keep "now" at the right edge — otherwise a disconnected
  // client would show a frozen chart with the last sample stuck on the right.
  setInterval(() => scopes.forEach(sc => sc.draw()), 1000);

  window.addEventListener("resize", () => scopes.forEach(s => s.resize()));
  scopes.forEach(s => s.resize());
  connect();
})();
</script>
</body>
</html>
